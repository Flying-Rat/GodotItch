        run: git submodule update --init --recursive
      - name: Install SCons
        run: sudo apt-get install -y scons
      - name: Build for Android x86_64
        run: |
          cd godot_itch_extension
          scons platform=android arch=x86_64
      - name: Copy binaries
        run: |
          mkdir -p addons/godot_itch/bin/android
          cp godot_itch_extension/bin/*x86_64* addons/godot_itch/bin/android/
      - name: Upload Android x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-android-x86_64
          path: addons/godot_itch/bin/android/*x86_64*

  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install SCons
        run: sudo apt-get install -y scons
      - name: Build for Android arm64
        run: |
          cd godot_itch_extension
          scons platform=android arch=arm64
      - name: Copy binaries
        run: |
          mkdir -p addons/godot_itch/bin/android
          cp godot_itch_extension/bin/*arm64* addons/godot_itch/bin/android/
      - name: Upload Android arm64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-android-arm64
          path: addons/godot_itch/bin/android/*arm64*

  release:
    needs:
      [build-linux-x86_64, build-linux-arm64, build-linux-rv64, build-macos, build-ios, build-windows-x86_32, build-windows-x86_64, build-android-x86_64, build-android-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create Release with Full Folder
        uses: softprops/action-gh-release@v2
        with:
          files: addons/godot_itch/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
