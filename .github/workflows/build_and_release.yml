      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install SCons
        run: sudo apt-get install -y scons
      - name: Build for Linux rv64
        run: |
          cd godot_itch_extension
          scons platform=linux arch=rv64
      - name: Copy binaries
        run: |
          mkdir -p addons/godot_itch/bin/linux
          cp godot_itch_extension/bin/*rv64* addons/godot_itch/bin/linux/
      - name: Upload Linux rv64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-linux-rv64
          path: addons/godot_itch/bin/linux/*rv64*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install SCons
        run: brew install scons
      - name: Build for Mac
        run: |
          cd godot_itch_extension
          scons platform=macos
      - name: Copy binaries
        run: |
          mkdir -p addons/godot_itch/bin/macos
          cp godot_itch_extension/bin/*macos* addons/godot_itch/bin/macos/
      - name: Upload MacOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-macos
          path: addons/godot_itch/bin/macos/*

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
