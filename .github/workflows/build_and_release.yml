  build-windows-x86_32:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install SCons
        run: choco install scons
      - name: Build for Windows x86_32
        run: |
          cd godot_itch_extension
          scons platform=windows arch=x86_32
      - name: Copy binaries
        run: |
          mkdir addons\godot_itch\bin\windows
          copy godot_itch_extension\bin\*x86_32* addons\godot_itch\bin\windows\
      - name: Upload Windows x86_32 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-windows-x86_32
          path: addons/godot_itch/bin/windows/*x86_32*

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
