name: Build and Release GDExtension

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:

  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install SCons
        run: sudo apt-get install -y scons
      - name: Build for Linux x86_64
        run: |
          cd godot_itch_extension
          scons platform=linux arch=x86_64
      - name: Copy binaries
        run: |
          mkdir -p addons/godot_itch/bin/linux
          cp godot_itch_extension/bin/*x86_64* addons/godot_itch/bin/linux/
      - name: Upload Linux x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-linux-x86_64
          path: addons/godot_itch/bin/linux/*x86_64*

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install SCons
        run: sudo apt-get install -y scons
      - name: Build for Linux arm64
        run: |
          cd godot_itch_extension
          scons platform=linux arch=arm64
      - name: Copy binaries
        run: |
          mkdir -p addons/godot_itch/bin/linux
          cp godot_itch_extension/bin/*arm64* addons/godot_itch/bin/linux/
      - name: Upload Linux arm64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godotitch-linux-arm64
          path: addons/godot_itch/bin/linux/*arm64*

  build-linux-rv64:
